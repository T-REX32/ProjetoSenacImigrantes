<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Curso</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
    <main class="container">
        <h1>Cadastrar curso</h1>
        <p class="ajuda">Os campos marcados com * são obrigatórios.</p>
        <p id="mensagem-sucesso" class="mensagem-sucesso" role="status" aria-live="polite" hidden>
            Curso cadastrado com sucesso.
        </p>

        <form id="form-curso" action="../cursos/inserir" method="post" accept-charset="UTF-8">

            <div class="campo">
                <label for="titulo">Título do curso *</label>
                <input type="text" id="titulo" name="titulo" maxlength="150" required autocomplete="off">
            </div>

            <div class="campo">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" rows="4" maxlength="255"></textarea>
            </div>

            <div class="campo">
                <label for="trilha">Código (id) da trilha *</label>
                <input type="number" id="trilha" name="trilha" min="1" step="1" inputmode="numeric" required>
                <small>A trilha precisa já estar cadastrada.</small>
            </div>

            <button type="submit" id="botao-salvar">Salvar curso</button>
        </form>
    </main>

    <script>
        if (new URLSearchParams(window.location.search).get('status') === 'sucesso') {
            document.getElementById('mensagem-sucesso').hidden = false;
        }

        // Evita cadastrar o mesmo curso duas vezes se o usuário clicar duas vezes no botão.
        document.getElementById('form-curso').addEventListener('submit', function () {
            var botao = document.getElementById('botao-salvar');
            botao.disabled = true;
            botao.textContent = 'Salvando...';
        });
    </script>
</body>
</html>
